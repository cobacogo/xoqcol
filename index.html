<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamFlix - Streaming Film Gratis</title>
    <style>
        /* Reset & Base Styling */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #141414;
            color: #FFFFFF;
            padding-bottom: 50px;
        }

        /* Navbar */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 5%;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 10;
        }

        .logo {
            color: #E50914;
            font-size: 24px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Main Player Section (Hero) */
        .hero-player {
            margin-top: 70px;
            padding: 20px 5%;
            max-width: 1200px;
            margin-left: auto;
            margin-right: auto;
        }

        .player-wrapper {
            position: relative;
            padding-bottom: 56.25%; /* Ratio 16:9 */
            height: 0;
            overflow: hidden;
            border-radius: 8px;
            background-color: #000;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
        }

        .player-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .video-details {
            margin-top: 15px;
        }

        .video-title {
            font-size: 22px;
            margin-bottom: 8px;
        }

        .video-desc {
            color: #AAAAAA;
            font-size: 14px;
            line-height: 1.4;
        }

        /* Content List / Catalog */
        .catalog-container {
            padding: 20px 5%;
            max-width: 1200px;
            margin: 0 auto;
        }

        .section-title {
            font-size: 18px;
            margin-bottom: 15px;
            color: #E5E5E5;
        }

        .movie-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 15px;
        }

        /* Card Film */
        .movie-card {
            background-color: #2F2F2F;
            border-radius: 4px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .movie-card:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(229, 9, 20, 0.4);
        }

        .movie-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
        }

        .movie-info {
            padding: 10px;
        }

        .movie-name {
            font-size: 13px;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Penyesuaian Tampilan Layar Besar / PC */
        @media (min-width: 768px) {
            .logo { font-size: 30px; }
            .movie-grid { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); }
            .movie-card img { height: 250px; }
            .video-title { font-size: 28px; }
        }
    </style>
</head>
<body>

    <!-- Header Navbar -->
    <nav class="navbar">
        <div class="logo">STREAMFLIX</div>
    </nav>

    <!-- Area Video Utama yang Sedang Diputar -->
    <div class="hero-player">
        <div class="player-wrapper">
            <!-- GANTI SRC DI BAWAH INI DENGAN LINK EMBED BUNNY STREAM ANDA -->
            <iframe 
                src="https://iframe.mediadelivery.net/embed/LIBRARY_ID/VIDEO_ID?autoplay=false" 
                allow="accelerometer; gyroscope; autoplay; encrypted-media; picture-in-picture;" 
                allowfullscreen="true">
            </iframe>
        </div>
        <div class="video-details">
            <h1 class="video-title">Judul Film Utama</h1>
            <p class="video-desc">Deskripsi singkat tentang jalan cerita film yang sedang diputar di atas. Tuliskan ringkasan plot menarik di sini.</p>
        </div>
    </div>

    <!-- Katalog Pilihan Film -->
    <div class="catalog-container">
        <h2 class="section-title">Trending Sekarang</h2>
        
        <div class="movie-grid">
            
            <!-- Poster 1 -->
            <div class="movie-card">
                <img src="https://via.placeholder.com/300x450/222/fff?text=Poster+1" alt="Film 1">
                <div class="movie-info">
                    <div class="movie-name">Judul Film 1</div>
                </div>
            </div>

            <!-- Poster 2 -->
            <div class="movie-card">
                <img src="https://via.placeholder.com/300x450/222/fff?text=Poster+2" alt="Film 2">
                <div class="movie-info">
                    <div class="movie-name">Judul Film 2</div>
                </div>
            </div>

            <!-- Poster 3 -->
            <div class="movie-card">
                <img src="https://via.placeholder.com/300x450/222/fff?text=Poster+3" alt="Film 3">
                <div class="movie-info">
                    <div class="movie-name">Judul Film 3</div>
                </div>
            </div>

            <!-- Poster 4 -->
            <div class="movie-card">
                <img src="https://via.placeholder.com/300x450/222/fff?text=Poster+4" alt="Film 4">
                <div class="movie-info">
                    <div class="movie-name">Judul Film 4</div>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
